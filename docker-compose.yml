services:
  db:
    image: postgres:16-alpine
    container_name: agendamento_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: agendamento
      POSTGRES_USER: agendamento
      POSTGRES_PASSWORD: agendamento
    # Porta do host em 5434: a maquina ja tem PostgreSQL nativo ocupando 5432 e 5433.
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendamento -d agendamento"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: agendamento_backend
    restart: unless-stopped
    environment:
      # Dentro da rede do Docker Compose, o Postgres e acessado pelo nome do
      # servico ("db") na porta interna 5432 — nao pela porta 5434 mapeada
      # para o host, que so serve para acesso de fora do Docker (ex.: DBeaver).
      DATABASE_URL: postgres://agendamento:agendamento@db:5432/agendamento
      DEBUG: "True"
      SECRET_KEY: django-insecure-docker-dev-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: agendamento_frontend
    restart: unless-stopped
    environment:
      # O navegador (fora do Docker) e quem faz as chamadas a API, entao a
      # URL precisa ser a porta mapeada no host, nao o nome do servico.
      VITE_API_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
